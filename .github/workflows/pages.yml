# Builds the Tutoring Gap Map from the public data and publishes it to GitHub Pages.
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Then run it from the Actions tab ("Publish site" -> Run workflow), or let the
# monthly schedule pick up new data.
name: Publish site

on:
  workflow_dispatch:
    inputs:
      sample:
        description: "Publish the SYNTHETIC demo (made-up data, clearly bannered) instead of real data"
        type: boolean
        default: false
  schedule:
    - cron: "17 6 2 * *"   # 06:17 UTC on the 2nd of each month
  push:
    branches: [main]
    paths: ["tgm/**", "sql/**", "requirements.txt", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q

      # KS4 results are committed under data/raw/ks4 (the performance-tables site blocks
      # scripted downloads), so this skips them and fetches GIAS + deprivation data.
      # --strict: if anything is still missing, stop here rather than publish a partial site.
      - name: Download public data
        if: ${{ !inputs.sample }}
        run: python -m tgm download --strict

      - name: Build database and run SQL
        run: python -m tgm build ${{ inputs.sample && '--sample' || '' }}

      - name: Build site
        run: python -m tgm site ${{ inputs.sample && '--sample' || '' }} --site-dir _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
