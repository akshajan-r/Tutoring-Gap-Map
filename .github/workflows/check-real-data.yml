# Temporary: run the whole pipeline on the real public data for this branch
# and print a summary, before anything is published.
name: Check real data
on:
  push:
    branches: [claude/confident-faraday-67l8yf]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m tgm download --strict
      - run: python -m tgm build
      - name: Summary
        run: python scripts/real_data_summary.py
      - run: python -m tgm site --site-dir _site
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site
