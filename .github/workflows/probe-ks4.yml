# Temporary: diagnose where GitHub Actions can fetch school-level KS4 data from.
name: Probe KS4 sources
on:
  push:
    branches: [claude/confident-faraday-67l8yf]
    paths: [scripts/probe_ks4_sources.py, .github/workflows/probe-ks4.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python scripts/probe_ks4_sources.py
